[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logquant"
version = "0.1.0"
description = "Offline log ingestion and diagnostic analysis prototype"
requires-python = ">=3.11"
dependencies = ["pydantic==2.10.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
logquant-ingest = "logquant.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
